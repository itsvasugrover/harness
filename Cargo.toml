[workspace]
resolver = "2"
members = [
  "apps/command-deck/src-tauri",
  "crates/harnessd",
  "crates/work-engine",
  "crates/model-switchboard",
  "crates/context-press",
  "crates/shell-trim",
  "crates/forge-bridge",
  "crates/ledger-sentinel",
  "crates/recall-ledger",
]

# Latest pins verified against crates.io on 2026-09-23.
# Policy: `cargo update` weekly; breaking majors land on feature branches.
# Tauri: v2 stable line (v3 is alpha — rejected, see docs/command-deck-desktop.md).
# YAML: noyalib (serde_yaml and serde_yml are both deprecated shims).
[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
axum = { version = "0.8.9" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
sha2 = { version = "0.11.0" }
noyalib = { version = "0.0.51" }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "macros"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = { version = "1.0.104" }
thiserror = { version = "2.0.20" }
tracing = { version = "0.1.44" }
futures = { version = "0.3.34" }
async-trait = { version = "0.1.92" }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
jsonwebtoken = { version = "11.1.0" }
keyring = { version = "4.2.0" }
